<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pillar Verdigris II</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Figtree:wght@300..700&display=swap">
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/core2.css">
<link rel="stylesheet" href="assets/fx2.css">
<style>
/* Layout: green-black patina. You fly low over a table of every project, follow a spiral of work, flip through trades and throw prints across a light table. */
:root{
  --bg:#07100d; --bg2:#0c1713; --cream:#e4e2d6; --mute:#8b9891; --line:rgba(228,226,214,.12); --line2:rgba(228,226,214,.3); --patina:#74c2a9;
  --d:"Host Grotesk","Helvetica Neue",Arial,sans-serif; --t:"Figtree","Helvetica Neue",Arial,sans-serif;
  --k-bg:var(--bg); --k-fg:var(--cream); --k-mute:var(--mute); --k-line:var(--line); --k-line2:var(--line2); --k-accent:var(--patina);
  --k-disp:var(--d); --k-text:var(--t); --k-gut:44px; --k-c-bg:#040907; --k-h-weight:300; --k-table:#1d2723;
  --px-lb-bg:#050b09; --px-lb-font:var(--t); --px-lb-display:var(--d); --px-lb-weight:300; --px-sw-bg:rgba(18,53,45,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--cream);font:400 16px/1.6 var(--t);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
.wrap{padding-inline:44px}
.h2{font:300 clamp(48px,6.6vw,120px)/.92 var(--d);letter-spacing:-.05em;margin:0;text-wrap:balance}
#top{background:radial-gradient(90% 70% at 50% 30%,#13241e,var(--bg) 70%)}
#top::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,var(--bg) 0,rgba(7,16,13,0) 26%,rgba(7,16,13,0) 70%,var(--bg))}
.pl-title{position:absolute;left:44px;bottom:110px;z-index:5;pointer-events:none}
.pl-title h1{font:300 clamp(72px,10vw,196px)/.84 var(--d);letter-spacing:-.06em;margin:0}
.pl-title p{margin:22px 0 0;font:400 17px/1.5 var(--t);max-width:38ch;color:rgba(228,226,214,.78)}
.pl-bar{position:absolute;left:50%;top:84px;translate:-50% 0;z-index:6;display:flex;gap:6px;padding:6px;border-radius:99px;background:rgba(7,16,13,.72);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line)}
.pl-bar button{font:500 13px/1 var(--t);color:var(--mute);background:none;border:0;padding:11px 15px;border-radius:99px;cursor:pointer;transition:.3s}
.pl-bar button[aria-pressed="true"]{background:var(--cream);color:var(--bg)}
.pl-bar sup{font-size:9px;margin-left:4px}
.pl-n{position:absolute;right:44px;bottom:110px;z-index:5;text-align:right;font:500 11px/1.5 var(--t);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.pl-n b{display:block;font:300 44px/1 var(--d);letter-spacing:-.03em;color:var(--cream);font-variant-numeric:tabular-nums}
#spiral{background:radial-gradient(60% 60% at 50% 50%,#10201b,var(--bg) 75%)}
#services{background:#050c0a}
#prints{--k-fg:#e4e2d6}
.ix{padding-block:150px 150px}
</style>
</head>
<body>
<div class="px-grain" aria-hidden="true" style="--grain:.07"></div>
<div id="nav"></div>
<main>
<section id="top" aria-label="Every Pillar project on one table"></section>
<section id="spiral" aria-label="A spiral of selected work"></section>
<section id="services" aria-label="The trades"></section>
<section id="prints" aria-label="A light table of prints"></section>
<section class="wrap ix" id="index">
  <p class="k-eyebrow">Project index</p>
  <h2 class="h2" style="margin-bottom:56px">The full record.</h2>
  <div id="ix"></div>
</section>
<div id="contactHost"></div>
</main>

<script src="assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="assets/core2.js"></script>
<script src="assets/kit2.js"></script>
<script src="assets/fx2.js"></script>
<script>
const {$,$$,esc,pad,loc,D}=PX;
$('#nav').innerHTML=K.nav([['#spiral','Spiral'],['#services','Trades'],['#prints','Prints'],['#index','Index']]);
$('#contactHost').outerHTML=K.contact('Let’s talk about your walls.');
PX.init({id:'02',cursor:true});
PX.loupe();

/* 3D table of every project */
const PR=D.projects.filter(p=>p.img);
const chips=[['all','All',PR.length],...D.services.map(s=>[s.id,K.SVC[s.id],PR.filter(p=>p.s===s.id).length])];
const pl=FX.plane($('#top'),{overlay:`<div class="pl-bar" id="plbar" role="group" aria-label="Filter the table by trade">${chips.map(([k,l,n],i)=>`<button type="button" data-f="${k}" aria-pressed="${!i}">${l}<sup>${n}</sup></button>`).join('')}</div><div class="pl-title"><h1>Fly over<br>the work.</h1><p>Every one of Pillar's 224 projects laid out on one table. Drag to fly across it, hover a print to lift it, filter by trade.</p></div><div class="pl-n"><b id="pln">${PR.length}</b>projects on the table</div>`});
$('#plbar').addEventListener('pointerdown',e=>e.stopPropagation());
$('#plbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#plbar button').forEach(x=>x.setAttribute('aria-pressed',x===b));const n=pl.filter(b.dataset.f);gsap.to({v:+$('#pln').textContent},{v:n,duration:.8,ease:'power3.out',onUpdate(){$('#pln').textContent=Math.round(this.targets()[0].v)}})});

/* helix, coverflow, light table */
FX.helix($('#spiral'),{items:K.best(28,0),eyebrow:'Selected work',title:'A spiral of twenty-eight buildings.',per:7,r:600,dy:120});
const CF=[];D.services.forEach(s=>{D.projects.filter(p=>p.s===s.id&&p.img).slice(0,4).forEach(p=>CF.push({p,group:K.SVC[s.id],tag:`${D.projects.filter(q=>q.s===s.id).length} projects`,text:s.short}))});
FX.coverflow($('#services'),{items:CF,eyebrow:'Trades',title:'Flip through the trades.'});
FX.table($('#prints'),{items:K.best(18,28),eyebrow:'Light table',title:'Pick them up. Throw them.'});
K.index($('#ix'),{limit:12});
K.wireContact();
</script>
</body>
</html>
