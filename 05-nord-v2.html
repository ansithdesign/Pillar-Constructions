<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pillar Nord II</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/core2.css">
<link rel="stylesheet" href="assets/fx2.css">
<style>
/* Layout: pale northern light. The work turns around you on a ring, then on a globe, the trades spin on a rolodex and each building opens into the next. */
:root{
  --snow:#eceeee; --frost:#e1e5e5; --ink:#0f1214; --mute:#737b7e; --line:rgba(15,18,20,.1); --line2:rgba(15,18,20,.28); --fjord:#2a6a8a; --night:#0c1012;
  --f:"Figtree","Helvetica Neue",Arial,sans-serif;
  --k-bg:var(--snow); --k-fg:var(--ink); --k-mute:var(--mute); --k-line:var(--line); --k-line2:var(--line2); --k-accent:var(--fjord);
  --k-disp:var(--f); --k-text:var(--f); --k-gut:40px; --k-h-weight:300;
  --k-c-bg:var(--night); --k-c-fg:var(--snow); --k-c-mute:#8a9295; --k-c-line:rgba(236,238,238,.14); --k-c-weight:300;
  --px-lb-bg:#0c1012; --px-lb-font:var(--f); --px-lb-display:var(--f); --px-lb-weight:300; --px-sw-bg:rgba(15,18,20,.88);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--snow)}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
.wrap{padding-inline:40px}
.h2{font:300 clamp(48px,6.4vw,118px)/.9 var(--f);letter-spacing:-.055em;margin:0;text-wrap:balance}

/* orbit */
.orbit{position:relative;height:100vh;overflow:hidden;background:radial-gradient(70% 60% at 50% 60%,#f6f7f7,var(--snow) 70%);cursor:grab}
.o-stage{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 42%}
.ring{position:absolute;left:50%;top:58%;width:0;height:0;transform-style:preserve-3d}
.oc{position:absolute;left:-150px;top:-200px;width:300px;height:400px;backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer;border-radius:6px;overflow:hidden;box-shadow:0 40px 70px rgba(15,18,20,.22)}
.oc img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.oc b{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;font:600 14px/1.25 var(--f);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.o-head{position:absolute;left:40px;top:108px;z-index:3;pointer-events:none}
.o-head h1{font:300 clamp(56px,6.4vw,124px)/.88 var(--f);letter-spacing:-.065em;margin:0}
.o-head h1 i{font-weight:200;color:var(--fjord)}
.o-hud{position:absolute;left:40px;right:40px;bottom:96px;z-index:3;display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}
.o-hud .now{font:500 12px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.o-hud .now b{display:block;font:400 30px/1.15 var(--f);letter-spacing:-.02em;text-transform:none;color:var(--ink);margin-top:6px;min-height:34px}
.o-hud .dial{width:120px;height:120px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);position:relative}
.o-hud .dial i{position:absolute;left:50%;top:6px;width:2px;height:18px;margin-left:-1px;background:var(--fjord);transform-origin:50% 54px}
.o-hud .dial span{position:absolute;inset:0;display:grid;place-items:center;font:500 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.o-hud .tip{font:500 12px/1.5 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:right}

#globe{background:radial-gradient(50% 55% at 50% 52%,#1b2a31,var(--night) 75%);color:var(--snow);--k-fg:var(--snow);--k-mute:#8a9295;--k-line:rgba(236,238,238,.12)}
#services{background:var(--frost)}
#zoom{background:#000}
.ix{padding-block:150px 150px}
</style>
</head>
<body>
<div class="px-grain" aria-hidden="true" style="--grain:.04"></div>
<div id="nav"></div>
<main>
<section class="orbit" id="top" aria-label="Projects on a turning ring">
  <div class="o-stage"><div class="ring" id="ring" data-lb-group></div></div>
  <div class="o-head"><h1>Built in<br><i>every</i> light.</h1></div>
  <div class="o-hud"><div class="now">Facing you<b id="on">—</b></div><div class="dial" aria-hidden="true"><i id="dial"></i><span id="deg">0°</span></div><div class="tip">Drag to turn the ring<br>Click the front project to open it</div></div>
</section>
<section id="globe" aria-label="A globe of projects"></section>
<section id="services" aria-label="The trades on a rolodex"></section>
<section id="zoom" aria-label="Each building opens into the next"></section>
<section class="wrap ix" id="index">
  <p class="k-eyebrow">Project index</p>
  <h2 class="h2" style="margin-bottom:56px">Every project, every state.</h2>
  <div id="ix"></div>
</section>
<div id="contactHost"></div>
</main>

<script src="assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="assets/core2.js"></script>
<script src="assets/kit2.js"></script>
<script src="assets/fx2.js"></script>
<script>
const {$,$$,esc,pad,loc,D}=PX;
$('#nav').innerHTML=K.nav([['#globe','Globe'],['#services','Trades'],['#zoom','Zoom'],['#index','Index']]);
$('#contactHost').outerHTML=K.contact('Turn the next one with us.');
PX.init({id:'05',cursor:true});
PX.loupe();

/* orbit */
const OR=K.best(18,6), NO=OR.length, STEP=360/NO, R=Math.round(160/Math.tan(Math.PI/NO))+40;
$('#ring').innerHTML=OR.map((p,i)=>`<a class="oc" href="#" data-lb="${p.id}" data-cursor="Open" style="transform:rotateY(${i*STEP}deg) translateZ(${R}px)"><img src="${K.G(p.img)}" alt="${esc(p.n)}" loading="lazy" draggable="false"><b>${esc(p.n)}</b></a>`).join('');
const ocs=$$('.oc'), ring=$('#ring');
let ang=0,tang=0,tilt=0,ttilt=0,scr=0,lastOn='';
PX.drag($('#top'),(dx)=>{tang+=dx*.18});
$('#top').addEventListener('pointermove',e=>{ttilt=(e.clientY/innerHeight-.5)*-10});
ScrollTrigger.create({trigger:'#top',start:'top top',end:'bottom top',scrub:true,onUpdate:s=>{scr=s.progress*140}});
(function spinLoop(){requestAnimationFrame(spinLoop);tang-=.06;ang+=(tang-ang)*.08;tilt+=(ttilt-tilt)*.06;const a=ang-scr;
  ring.style.transform=`translateZ(${-R}px) rotateX(${tilt}deg) rotateY(${a}deg)`;
  let bi=0,bc=-2;ocs.forEach((c,i)=>{const cs=Math.cos((i*STEP+a)*Math.PI/180);c.style.filter=`brightness(${(.45+.55*Math.max(0,cs)).toFixed(3)})`;c.style.pointerEvents=cs>.6?'auto':'none';if(cs>bc){bc=cs;bi=i}});
  const p=OR[bi];if(p.n!==lastOn){lastOn=p.n;$('#on').textContent=`${p.n} · ${p.c}`}
  const deg=((-a%360)+360)%360;$('#dial').style.transform=`rotate(${deg}deg)`;$('#deg').textContent=Math.round(deg)+'°'})();

/* globe, rolodex, infinite zoom */
FX.sphere($('#globe'),{items:K.best(60,0),eyebrow:'Twelve states',title:'The work, as a world.',sub:'Sixty projects on one globe. Drag to spin it and hover a print to pull it toward you.',r:440});
FX.drum($('#services'),{services:K.svcs({drywall:'V16-018D',rainscreen:'V19-019R','eifs-stucco':'V16-047',restoration:'V10-002','exterior-panels':'EP_003'}),eyebrow:'Five trades',title:'Turn the rolodex.'});
FX.zoom($('#zoom'),{items:['The_Westerly_Waterfront_1','V17-004D','6565Rt','8621Rt','College_Park_City_Hall_1','V18-002R','V19-019R'].map(id=>PX.byImg[id]),eyebrow:'Thirty years',title:'Every building opens onto the next.'});
K.index($('#ix'),{limit:12});
K.wireContact();
</script>
</body>
</html>
