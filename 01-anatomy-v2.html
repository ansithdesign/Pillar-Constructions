<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pillar Anatomy II</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap">
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/core2.css">
<link rel="stylesheet" href="assets/fx2.css">
<style>
/* Layout: a dark corridor of photographs you walk through, then a facade that ripples under your hand, a tower of trades that comes apart and photographs that shatter into the next. */
:root{
  --paper:#f1ede6; --paper-2:#e6e1d8; --ink:#191816; --mute:#77706a; --line:rgba(25,24,22,.12); --line2:rgba(25,24,22,.28);
  --navy:#24398a; --void:#0a0b0d; --bone:#efebe4;
  --f:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --k-bg:var(--paper); --k-fg:var(--ink); --k-mute:var(--mute); --k-line:var(--line); --k-line2:var(--line2); --k-accent:var(--navy);
  --k-disp:var(--f); --k-text:var(--f); --k-gut:48px; --k-nav-fg:#fff; --k-nav-blend:difference; --k-h-weight:300;
  --k-c-bg:var(--void); --k-c-fg:var(--bone); --k-c-mute:#8f8b85; --k-c-line:rgba(239,235,228,.14); --k-c-weight:300;
  --px-lb-bg:#0d0f14; --px-lb-font:var(--f); --px-lb-display:var(--f); --px-lb-weight:300; --px-sw-bg:rgba(36,57,138,.88);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
.wrap{padding-inline:48px}
.h2{font:300 clamp(48px,6.4vw,116px)/.92 var(--f);letter-spacing:-.055em;margin:0;text-wrap:balance}

/* tunnel */
.tunnel{position:relative;height:100vh;background:var(--void);overflow:hidden;color:var(--bone)}
.stage{position:absolute;inset:0;perspective:820px;perspective-origin:50% 50%}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tp{position:absolute;left:-260px;top:-175px;width:520px;height:350px;transform-style:preserve-3d;cursor:pointer;backface-visibility:hidden}
.tp.pt{left:-180px;top:-240px;width:360px;height:480px}
.tp img{width:100%;height:100%;object-fit:cover;transition:filter .5s;filter:brightness(.92)}
.tp:hover img{filter:brightness(1.18) contrast(1.05)}
.tp::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:box-shadow .4s}
.tp:hover::after{box-shadow:inset 0 0 0 2px #fff}
.tp b{position:absolute;left:0;top:calc(100% + 10px);font:500 13px/1.3 var(--f);white-space:nowrap;opacity:0;transform:translateY(6px);transition:.5s cubic-bezier(.16,1,.3,1)}
.tp:hover b{opacity:1;transform:none}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 60% at 50% 50%,transparent 30%,rgba(10,11,13,.85) 100%)}
.t-head{position:absolute;left:48px;top:120px;z-index:3;pointer-events:none}
.t-head h1{font:200 clamp(64px,9vw,168px)/.86 var(--f);letter-spacing:-.06em;margin:0}
.t-head h1 em{font-style:italic;font-weight:300;color:#9fb0ff}
.t-head p{margin:22px 0 0;color:rgba(239,235,228,.7);max-width:40ch;font-size:17px}
.hud{position:absolute;left:48px;right:48px;bottom:96px;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:24px;font:500 12px/1.4 var(--f);letter-spacing:.08em;text-transform:uppercase;color:rgba(239,235,228,.7);pointer-events:none}
.hud .now b{display:block;font:400 26px/1.15 var(--f);letter-spacing:-.02em;text-transform:none;color:var(--bone);margin-top:6px;min-height:30px}
.depth{text-align:center}.depth b{display:block;font:200 64px/.9 var(--f);letter-spacing:-.04em;color:var(--bone);font-variant-numeric:tabular-nums}
.hint{text-align:right}
.speed{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.08);z-index:3}
.speed i{display:block;height:100%;background:#9fb0ff;transform-origin:left;transform:scaleX(0)}

/* sections built by fx2 */
#facade{background:var(--void);color:var(--bone);--k-fg:var(--bone);--k-mute:#8f8b85;--k-line:rgba(239,235,228,.12)}
#services{background:var(--paper-2)}
#work{background:#08090b;color:var(--bone);--k-fg:var(--bone);--k-mute:#8f8b85}
.ix{padding-block:150px 160px}
</style>
</head>
<body>
<div class="px-grain" aria-hidden="true" style="--grain:.05"></div>
<div id="nav"></div>
<main>
<section class="tunnel" id="top" aria-label="A corridor of Pillar projects">
  <div class="stage" id="stage"><div class="cam" id="cam" data-lb-group></div></div>
  <div class="fog" aria-hidden="true"></div>
  <div class="speed" aria-hidden="true"><i id="spd"></i></div>
  <div class="t-head" id="thead"><h1>Walk through<br><em>224</em> buildings.</h1><p>Drywall, rainscreen, EIFS and exterior panels by Pillar Construction since 1995. Scroll to move forward and move the mouse to look around.</p></div>
  <div class="hud"><div class="now">Now passing<b id="now">—</b></div><div class="depth"><b id="dep">000</b>metres in</div><div class="hint">Click any frame to open it</div></div>
</section>
<section id="facade" aria-label="A facade of projects"></section>
<section id="services" aria-label="The trades as a tower"></section>
<section id="work" aria-label="Selected work"></section>
<section class="wrap ix" id="index">
  <p class="k-eyebrow">Project index</p>
  <h2 class="h2" style="margin-bottom:56px">Every building on record.</h2>
  <div id="ix"></div>
</section>
<div id="contactHost"></div>
</main>

<script src="assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="assets/core2.js"></script>
<script src="assets/kit2.js"></script>
<script src="assets/fx2.js"></script>
<script>
const {$,$$,esc,pad,loc,D}=PX;
$('#nav').innerHTML=K.nav([['#facade','Facade'],['#services','Trades'],['#work','Work'],['#index','Index']]);
$('#contactHost').outerHTML=K.contact('Walk the site with us.');
PX.init({id:'01',cursor:true});
PX.loupe();

/* tunnel */
const TP=[...K.best(64)].slice(0,60), GAP=300, START=600, DEPTH=TP.length*GAP+START;
const slots=[['L'],['R'],['C',-1],['T'],['R'],['L'],['C',1],['B']];
$('#cam').innerHTML=TP.map((p,i)=>{
  const [s,side]=slots[i%slots.length], z=-(START+i*GAP), j=(i*37%9-4)*14; let t;
  if(s==='L')t=`translate3d(-700px,${j}px,${z}px) rotateY(62deg)`;
  else if(s==='R')t=`translate3d(700px,${-j}px,${z}px) rotateY(-62deg)`;
  else if(s==='T')t=`translate3d(${j*3}px,-400px,${z}px) rotateX(-64deg)`;
  else if(s==='B')t=`translate3d(${-j*3}px,400px,${z}px) rotateX(64deg)`;
  else t=`translate3d(${side*(300+Math.abs(j))}px,${j*1.5}px,${z}px)`;
  return `<a class="tp${i%5===2?' pt':''}" href="#" data-lb="${p.id}" data-cursor="Open" data-z="${z}" style="transform:${t}"><img src="${K.G(p.img)}" alt="${esc(p.n)}, ${esc(loc(p))}" ${i<8?'':'loading="lazy"'} decoding="async"><b>${esc(p.n)} · ${esc(p.c)}</b></a>`;
}).join('');
const tps=$$('.tp'), cam=$('#cam'), stage=$('#stage'), thead=$('#thead');
let tz=0,cz=0,mx=0,my=0,rx=0,ry=0,vel=0,lastNow='';
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
ScrollTrigger.create({trigger:'#top',start:'top top',end:'+=650%',pin:true,scrub:true,onUpdate:s=>{tz=s.progress*(DEPTH-200);const k=Math.min(1,s.progress*9);thead.style.opacity=1-k;thead.style.transform=`translateY(${-k*70}px)`}});
(function tick(){
  requestAnimationFrame(tick);
  const v=PX.lenis?Math.abs(PX.lenis.velocity||0):0; vel+=(v-vel)*.08;
  cz+=(tz-cz)*.09; rx+=(-my*9-rx)*.06; ry+=(mx*16-ry)*.06;
  const roll=Math.max(-6,Math.min(6,(tz-cz)*.004));
  stage.style.perspective=(820-Math.min(360,vel*9))+'px';
  cam.style.transform=`rotateZ(${roll}deg) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${cz}px)`;
  $('#spd').style.transform=`scaleX(${Math.min(1,vel/40)})`;
  let best=null,bd=1e9;
  for(const el of tps){const vz=+el.dataset.z+cz,o=vz>120?Math.max(0,1-(vz-120)/260):Math.max(0,Math.min(1,1-(-vz-900)/4200));el.style.opacity=o.toFixed(3);el.style.pointerEvents=o>.25?'auto':'none';if(vz<0&&-vz<bd){bd=-vz;best=el}}
  $('#dep').textContent=String(Math.round(cz/10)).padStart(3,'0');
  const nm=best?best.querySelector('b').textContent:''; if(nm!==lastNow){lastNow=nm;$('#now').textContent=nm}
})();

/* facade, tower, shatter */
FX.wave($('#facade'),{items:K.best(48,4),eyebrow:'The facade',title:'Run your hand along it.',sub:'Every tile is a Pillar project. Move across the wall and it lifts toward you; click any tile to open it.'});
FX.tower($('#services'),{services:K.svcs({drywall:'VA_Hostpital_Fredericksburg_1',rainscreen:'V18-014R','eifs-stucco':'V16-047',restoration:'V10-002','exterior-panels':'EP_003'}),eyebrow:'Five trades',title:'One building, five floors.',w:380});
FX.shatter($('#work'),{items:['V17-004D','6565Rt','8621Rt','The_Westerly_Waterfront_1','V19-019R','College_Park_City_Hall_1'].map(id=>PX.byImg[id]),eyebrow:'Selected work',title:'Taken apart, put back together.'});
K.index($('#ix'),{limit:12});
K.wireContact();
</script>
</body>
</html>
